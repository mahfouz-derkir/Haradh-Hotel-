
name: Build Haradh Hotel APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Verify Android project
        run: |
          echo "Repository files:"
          ls -la
          test -f settings.gradle || {
            echo "ERROR: settings.gradle is missing from repository root"
            exit 1
          }
          test -f app/build.gradle || {
            echo "ERROR: app/build.gradle is missing"
            exit 1
          }

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HaradhHotel-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
