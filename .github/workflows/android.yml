name: Build Haradh Hotel APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7.2"

      - name: Verify Android project
        working-directory: HaradhHotel_StandaloneApp_Project
        run: |
          echo "Repository files:"
          ls -la
          test -f settings.gradle || {
            echo "ERROR: settings.gradle is missing from Android project root"
            exit 1
          }
          test -f app/build.gradle || {
            echo "ERROR: app/build.gradle is missing"
            exit 1
          }

      - name: Generate Gradle wrapper if missing
        working-directory: HaradhHotel_StandaloneApp_Project
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.7.2
          fi

      - name: Build APK
        working-directory: HaradhHotel_StandaloneApp_Project
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HaradhHotel-debug-apk
          path: HaradhHotel_StandaloneApp_Project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
