
name: Build Haradh Hotel APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Locate project files
        id: locate
        shell: bash
        run: |
          echo "Repository root:"
          ls -la
          FILE=$(find . -type f -name settings.gradle -not -path '*/.gradle/*' | head -n 1)
          if [ -z "$FILE" ]; then
            echo "ERROR: settings.gradle was not found"
            exit 1
          fi
          DIR=$(dirname "$FILE")
          echo "Project directory: $DIR"
          echo "project_dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Build APK
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HaradhHotel-debug-apk
          path: '**/app/build/outputs/apk/debug/app-debug.apk'
          if-no-files-found: error
